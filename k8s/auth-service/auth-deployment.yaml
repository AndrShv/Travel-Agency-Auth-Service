apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-1-6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service-1-6
  template:
    metadata:
      labels:
        app: auth-service-1-6
    spec:
      containers:
        - name: auth-service
          image: auth-service-1-6:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-0.mysql:3306/authservice
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: "1111"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: guest
            - name: SPRING_RABBITMQ_PASSWORD
              value: guest