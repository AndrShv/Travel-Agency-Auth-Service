<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        .auth-container { max-width: 400px; margin: 80px auto; padding: 2rem; background:white; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
        .btn-gradient { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; border-radius:50px; width:100%; }
    </style>
</head>
<body>
<div class="auth-container">
    <h2>Reset Password</h2>
    <p>Enter the code from your email and a new password for your account.</p>

    <form th:action="@{/auth/reset-password}" th:object="${resetPasswordDto}" method="post">
        <div class="form-group">
            <label for="token">Code from email</label>
            <input type="text" class="form-control" id="token" th:field="*{token}" placeholder="Enter the 6-digit code" required>
        </div>
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" placeholder="Enter new password" required>
        </div>
        <div th:if="${error}" class="text-danger mb-2" th:text="${error}"></div>
        <button type="submit" class="btn btn-gradient mt-3">Change Password</button>
    </form>
</div>
</body>
</html>
