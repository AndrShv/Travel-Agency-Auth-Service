<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Page</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/register.css}">

</head>
<body>

<div class="auth-container">
    <h2>Registration</h2>

    <form th:action="@{/auth/register}" th:object="${userRegistrationDto}" method="post">

        <div class="form-group">
            <label for="username">Name</label>
            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Enter name" required>
            <div th:if="${#fields.hasErrors('username')}" class="error-message" th:errors="*{username}"></div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Enter email" required>
            <div th:if="${#fields.hasErrors('email')}" class="error-message" th:errors="*{email}"></div>
        </div>


        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Enter password" required>
            <div th:if="${#fields.hasErrors('password')}" class="error-message" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn btn-gradient mt-3">Register</button>
    </form>

    <p class="mt-3 text-center">
        Already have an account? <a th:href="@{/auth/login}">Log in</a>
    </p>
    <div class="text-center mt-3">
        <a class="btn btn-google btn-block" th:href="@{/oauth2/authorization/google}">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 533.5 544.3" style="margin-right:8px; vertical-align: middle;">
                <path fill="#4285f4" d="M533.5 278.4c0-17.9-1.6-35.3-4.6-52H272v98.7h146.9c-6.3 34-25.4 62.8-54.4 82l88 68.5c51.6-47.7 81-117.5 81-197.2z"/>
                <path fill="#34a853" d="M272 544.3c73.6 0 135.3-24.4 180.5-66.3l-88-68.5c-24.5 16.5-55.7 26.1-92.5 26.1-71.1 0-131.3-47.8-152.8-112.1l-90.2 69.7c45.6 90 139.2 151.1 243 151.1z"/>
                <path fill="#fbbc04" d="M119.7 323.2c-10.5-31.7-10.5-65.7 0-97.4l-90.2-69.7C3.3 212.4 0 240.1 0 272c0 31.9 3.3 59.6 29.5 115.9l90.2-69.7z"/>
                <path fill="#ea4335" d="M272 107.8c38.8-.6 73.2 14.2 100.7 41l75.3-75.3C407 23.7 345.3 0 272 0 168.2 0 74.6 61.1 29 151.1l90.2 69.7C140.7 155.6 200.9 107.8 272 107.8z"/>
            </svg>
            Register with Google
        </a>
    </div>

</div>

</body>
</html>
