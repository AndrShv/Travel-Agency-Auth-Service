<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password?</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        .auth-container { max-width: 400px; margin: 80px auto; padding: 2rem; background:white; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
        .btn-gradient { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; border-radius:50px; width:100%; }
    </style>
</head>
<body>
<div class="auth-container">
    <h2>Forgot Password?</h2>
    <p>Enter your email, and we'll send you a 6-digit code to reset your password.</p>

    <form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordDto}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Enter email" required>
            <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
        </div>
        <div th:if="${error}" class="text-danger mb-2" th:text="${error}"></div>
        <button type="submit" class="btn btn-gradient mt-3">Send Code</button>
    </form>

    <p class="mt-3 text-center"><a th:href="@{/auth/login}">Return to login</a></p>
</div>
</body>
</html>
